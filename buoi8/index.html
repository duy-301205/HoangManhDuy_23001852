<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { max-width: 820px; margin: 32px auto; padding: 0 16px; color: #1e293b; }
        h1, h2 { margin-top: 0; margin-bottom: 12px; }
        .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; margin-left: 8px; }
        .btn-edit { background: #f59e0b; color: #fff; margin-right: 6px; }
        .btn-delete { background: #dc2626; color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; }
        th { background: #f1f5f9; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
    </style>
</head>
<body>
    <div id="app">
        <h1>Quản lý sản phẩm</h1>

        <div v-if="errorMessage" class="alert alert-error">
            {{ errorMessage }}
        </div>
        <div v-if="successMessage" class="alert alert-success">
            {{ successMessage }}
        </div>

        <div class="card">
            <h2>{{ editingId !== null ? 'Sửa sản phẩm #' + editingId : 'Thêm sản phẩm mới' }}</h2>
            <form @submit.prevent="saveProduct">
                <div class="form-grid">
                    <div>
                        <label for="name">Tên sản phẩm</label>
                        <input
                            id="name"
                            type="text"
                            v-model="form.name"
                            placeholder="Nhập tên sản phẩm"
                        >
                    </div>
                    <div>
                        <label for="price">Đơn giá</label>
                        <input
                            id="price"
                            type="number"
                            step="any"
                            v-model="form.price"
                            placeholder="Ví dụ: 10000"
                        >
                    </div>
                    <div>
                        <label for="stock">Số lượng tồn</label>
                        <input
                            id="stock"
                            type="number"
                            step="any"
                            v-model="form.stock"
                            placeholder="Ví dụ: 20"
                        >
                    </div>
                </div>
                <button type="submit" class="btn-primary">Lưu</button>
                <button
                    v-if="editingId !== null"
                    type="button"
                    class="btn-secondary"
                    @click="resetForm"
                >
                    Hủy
                </button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th class="text-right">Đơn giá (đồng)</th>
                    <th class="text-right">Số lượng tồn</th>
                    <th class="text-center">Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr v-if="products.length === 0">
                    <td colspan="4" class="text-center">Chưa có sản phẩm nào.</td>
                </tr>
                <tr v-for="product in products" :key="product.id">
                    <td>{{ product.name }}</td>
                    <td class="text-right">{{ formatPrice(product.price) }}</td>
                    <td class="text-right">{{ product.stock }}</td>
                    <td class="text-center">
                        <button type="button" class="btn-edit" @click="startEdit(product)">
                            Sửa
                        </button>
                        <button type="button" class="btn-delete" @click="deleteProduct(product)">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="app.js"></script>
</body>
</html>
